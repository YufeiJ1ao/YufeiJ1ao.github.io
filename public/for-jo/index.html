<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100e10"><title>for jo</title>
  <meta name="description" content="赠姐姐Jo的一份生辰礼。一封生辰贺帖，二十四支古风吉签。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23100e10'/%3E%3Cpath d='M6 6H26V26H6ZM10 10H22V22H10Z' fill='none' stroke='%23d6b475'/%3E%3Crect x='13' y='9' width='6' height='14' fill='%23921e2e'/%3E%3C/svg%3E">
  <link rel="preload" href="./assets/lacquer-box.webp" as="image">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="scenery" aria-hidden="true"></div><div class="page-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header><a class="brand" href="./" aria-label="生日惊喜首页"><span class="brand-mark">贺</span><span class="site-name">for jo</span></a><button id="sound" class="sound" aria-label="开启音乐" aria-pressed="false"><span aria-hidden="true">♫</span><span id="music-label">音乐关</span></button></header>
  <main>
    <div class="intro"><p class="recipient">赠 · 姐姐Jo</p><h1 id="page-heading">生辰喜乐</h1><p class="date"><span></span>十月四日<span></span></p></div>
    <nav class="site-nav" role="tablist" aria-label="生辰惊喜"><button id="gift-tab" role="tab" aria-selected="true" aria-controls="gift-content">生辰贺帖</button><span aria-hidden="true">✦</span><button id="oracle-tab" role="tab" aria-selected="false" aria-controls="oracle-content" tabindex="-1">生辰启签</button></nav>
    <div id="gift-content" role="tabpanel" aria-labelledby="gift-tab">
    <div class="experience" id="experience" aria-busy="false">
      <div class="aperture" aria-hidden="true"></div>
      <div class="side-tab left" aria-hidden="true"><span>壹</span><span>启匣</span><i></i></div><div class="side-tab right" aria-hidden="true"><span>贰</span><span>贺生辰</span><i></i></div>
      <div class="gift-stage">
        <button id="chest" class="chest" aria-label="启封生辰礼，打开姐姐Jo的生日贺帖"><span class="box-base" aria-hidden="true"></span><span class="box-lid" aria-hidden="true"></span><span class="seal" aria-hidden="true">启</span></button>
        <section class="letter" id="letter" hidden aria-labelledby="letter-title" tabindex="-1">
          <div class="letter-frame" aria-hidden="true"></div><div class="letter-content"><p class="letter-kicker">生 辰 贺 帖</p><span class="letter-rule" aria-hidden="true">✦</span><h2 id="letter-title">姐姐Jo，生辰喜乐。</h2><p>愿你江湖快意，岁岁安然。</p><p>所行皆坦途，所愿皆可期。</p><div class="signature">焦焦 敬贺</div><div class="letter-actions"><button id="to-oracle" class="replay">启一支签</button><button id="replay" class="replay">再启贺帖</button></div></div><span class="stamp" aria-hidden="true">贺</span>
        </section>
      </div>
    </div>
    <div class="action-area" id="actions"><button id="primary" class="primary"><span aria-hidden="true">✧</span>启封生辰礼<span aria-hidden="true">✧</span></button><p id="hint" role="status" aria-live="polite">一岁一礼，一寸欢喜。</p></div>
    </div>
    <section id="oracle-content" class="oracle-panel" role="tabpanel" aria-labelledby="oracle-tab" hidden>
      <p class="oracle-caption">二十四签 · 皆为好意</p>
      <div class="oracle-stage" id="oracle-stage" aria-busy="false">
        <button class="fortune-tube" id="fortune-tube" aria-label="左右滑动摇签，或点按抽签"><img src="./assets/fortune-cylinder.webp" alt="黑红金色的古风签筒，筒中装有竹签" draggable="false"></button>
        <span class="departing-lot" aria-hidden="true">吉</span>
        <article id="lot-card" class="lot-card" hidden tabindex="-1" aria-labelledby="lot-title"><div class="lot-frame" aria-hidden="true"></div><p class="lot-number" id="lot-number"></p><h2 id="lot-title"></h2><div class="lot-poem"><p id="lot-line-one"></p><p id="lot-line-two"></p></div><span class="lot-divider" aria-hidden="true">✦</span><p id="lot-note" class="lot-note"></p><p class="lot-recipient">赠 · 姐姐Jo</p><button id="reshake" class="replay">收签，再摇一次</button><span class="lot-stamp" aria-hidden="true">吉</span></article>
      </div>
      <div id="shake-progress" class="shake-progress" role="progressbar" aria-label="摇签进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="shake-fill"></span></div>
      <p id="oracle-status" class="oracle-status" role="status" aria-live="polite">左右滑动签筒，或点一下启签。</p>
      <button id="draw-lot" class="primary oracle-draw"><span aria-hidden="true">✧</span><span id="draw-label">轻摇启签</span><span aria-hidden="true">✧</span></button>
      <button id="motion-toggle" class="motion-toggle" aria-pressed="false" hidden>开启摇一摇</button><p id="motion-status" class="motion-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer><span>问水藏剑 · 山居剑意</span><div class="steps" aria-label="惊喜进度"><span id="step-one" class="active">壹</span><i></i><span id="step-two">贰</span></div><span>焦焦 敬贺</span></footer>
  <noscript><p class="noscript">姐姐Jo，生辰喜乐。愿你江湖快意，岁岁安然。所行皆坦途，所愿皆可期。焦焦敬贺。</p></noscript>
  <script src="./fortunes.js" defer></script>
  <script src="./music.js" defer></script>
  <script src="./main.js" defer></script>
</body>
</html>
